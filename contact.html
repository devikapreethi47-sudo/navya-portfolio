<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Navya S M</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">NAVYA.SM</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="certifications.html">Certifications</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="contact">
            <div class="container">
                <h2 class="section-title fade-in">Get In Touch</h2>
                
                <div class="contact-wrapper">
                    <div class="contact-info fade-in">
                        <h3>Let's talk about everything!</h3>
                        <p style="margin-bottom: 2rem; color: var(--text-secondary);">
                            Don't like forms? Send me an email. 👋
                        </p>
                        
                        <div class="contact-details">
                            <div class="detail-item">
                                <i class="fas fa-envelope"></i>
                                <div>
                                    <h4>Email</h4>
                                    <p>navya@example.com</p>
                                </div>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-location-dot"></i>
                                <div>
                                    <h4>Location</h4>
                                    <p>India</p>
                                </div>
                            </div>
                        </div>

                        <div class="social-links" style="justify-content: flex-start; margin-top: 3rem;">
                            <a href="#"><i class="fab fa-linkedin"></i></a>
                            <a href="#"><i class="fab fa-github"></i></a>
                            <a href="#"><i class="fab fa-twitter"></i></a>
                        </div>
                    </div>

                    <form class="contact-form fade-in" onsubmit="return false;">
                        <div class="form-group">
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Your Email" required>
                        </div>
                        <div class="form-group">
                            <input type="text" placeholder="Subject">
                        </div>
                        <div class="form-group">
                            <textarea placeholder="Your Message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Navya S M. All rights reserved.</p>
        </div>
    </footer>

    <style>
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 4rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .detail-item i {
            width: 50px;
            height: 50px;
            background: var(--surface-color);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .contact-form {
            background: var(--surface-color);
            padding: 3rem;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: white;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 992px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            .contact-form {
                padding: 2rem;
            }
        }
    </style>

    <script src="js/main.js"></script>
    <script>
        document.querySelector('.contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Thank you! This is a demo form. In a live environment, this would be connected to a backend service.");
        });
    </script>
</body>
</html>
